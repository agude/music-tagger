# Callable CI. Every step calls a just recipe, so this file only changes when
# the shape of the pipeline changes — not when the tooling does.
#
# Called by tests.yml (push/PR).
name: CI

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just sync

      - name: Lint
        run: just lint

      - name: Type check
        run: just type-check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    name: Python ${{ matrix.python-version }}
    # .python-version pins 3.12 and uv honours it on the runner too, so
    # without this override every leg would test the same interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # libdiscid is a system dependency of the discid package; without it
      # the import fails at collection time.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdiscid0

      - name: Install dependencies
        run: just sync

      - name: Test
        run: just test
